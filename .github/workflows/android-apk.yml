name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'src/**'
      - 'app/**'
      - 'index.ts'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies from lockfile
        run: npm ci
      - name: Generate Android project with Expo
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Disable R8 shrinking for WorkManager startup diagnosis
        working-directory: android
        run: |
          # The current APK crashes before React Native starts while Room/WorkManager
          # tries to instantiate WorkDatabase.canonicalName. Test without R8 shrinking.
          printf '\\nandroid.enableProguardInReleaseBuilds=false\\nandroid.enableMinifyInReleaseBuilds=false\\n' >> gradle.properties
          grep -nE 'minifyEnabled|enableProguardInReleaseBuilds|enableMinifyInReleaseBuilds' app/build.gradle gradle.properties
      - name: Build arm64 release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ping-android-arm64-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
